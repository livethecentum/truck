<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap&text=%EC%98%A4%EB%8A%98%EC%9D%98%20%ED%91%B8%EB%93%9C%ED%8A%B8%EB%9F%ADABCDE">
<script>
  /* 앱(Apps Script) 주민 화면을 이 페이지 안에 끼워 넣어 엽니다 — 구글의 "Apps Script 사용자가 만들었습니다" 안내가 가려지고 주소창은 github.io 로 남음.
     index.html·owner.html 의 APP_URL 과 같은 주소여야 합니다 (배포 주소가 바뀌면 세 파일 모두 고치기) */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwjJjUpcnmtXTRk7pbqFLmmg4b7M1Zb_QZKC-M5d_gabPM1p0hL7juK2tblVztOzl__wg/exec';

</script>
<style>
  /* 앱(Styles.html)과 같은 토큰 */
  :root {
    --bg: #ECEDE8; --surface: #FFFFFF; --ink: #18202E; --muted: #535C6B; --line-strong: #C3C8D0;
    --sign: #FFC527; --sign-ink: #18202E; --brand: #8F6A2C; --deco: #C9CCC2; --focus: #2453A3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1522; --surface: #182134; --ink: #ECEFF5; --muted: #A7B0C0; --line-strong: #3B4866;
      --sign: #FFCB3D; --sign-ink: #141A26; --brand: #D2AE6E; --deco: #253049; --focus: #96BAFF;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  p, h1 { margin: 0; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* 배경 장식: 떠다니는 음식 (앱과 같은 아이콘·위치) */
  .food-sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; color: var(--deco); }
  .food-sky i { position: absolute; display: block; transform: rotate(var(--r)); animation: food-drift 30s ease-in-out infinite alternate; will-change: transform; }
  .food-sky svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes food-drift {
    0%   { transform: translate(0, 0) rotate(var(--r)); }
    50%  { transform: translate(.75rem, -1.75rem) rotate(calc(var(--r) + 8deg)); }
    100% { transform: translate(-.5rem, -.75rem) rotate(calc(var(--r) - 4deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .food-sky i { animation: none; } }
  @media (max-width: 47.99rem) { .food-sky { opacity: .75; } .food-sky i:nth-child(n+11) { display: none; } }


  /* ---------- 스플래시: 트럭이 자리 줄을 지나가며 표지에 불을 켬 (한 장면) ---------- */
  .wait { position: fixed; inset: 0; z-index: 2; background: var(--bg); transition: opacity .3s; }
  .wait[hidden] { display: none; }
  .wait.out { opacity: 0; pointer-events: none; }
  .stage { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; align-content: center; gap: 1.75rem; padding: 1.5rem; text-align: center; }
  .logo { display: block; width: 3.75rem; height: 4.25rem; margin: 0 auto .875rem; background: var(--brand); -webkit-mask: url(logo.png) center / contain no-repeat; mask: url(logo.png) center / contain no-repeat; }
  h1 { font-family: 'Black Han Sans', Pretendard, sans-serif; font-weight: 400; font-size: 2.25rem; line-height: 1.1; }
  .today { margin-top: .375rem; font-weight: 700; color: var(--muted); }

  .lot { width: min(20rem, 100%); }
  .bays { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; }
  .sign { height: 3.25rem; border-radius: 8px; display: grid; place-items: center; align-content: center; background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .sign b { font-family: 'Black Han Sans', Pretendard, sans-serif; font-weight: 400; font-size: 1.5rem; line-height: 1; }
  .sign small { font-size: .6875rem; font-weight: 800; line-height: 1.1; opacity: .8; }
  .road { position: relative; height: 2.75rem; margin-top: .5rem; border-bottom: 2px dashed var(--line-strong); overflow: hidden; }
  .truck { position: absolute; bottom: .125rem; left: 0; width: 2.5rem; height: 2.5rem; color: var(--ink); animation: drive 3.2s linear infinite; }
  .truck svg { display: block; width: 100%; height: 100%; }
  /* 트럭 앞(오른쪽)이 각 자리 가운데를 지날 때 그 표지가 켜지도록 lit0~4 와 같은 시간표 */
  @keyframes drive {
    0%   { transform: translateX(-2.5rem); }
    75%  { transform: translateX(calc(min(20rem, 100vw - 3rem) - 1.25rem)); }
    100% { transform: translateX(calc(min(20rem, 100vw - 3rem) + 1rem)); }
  }
  @keyframes lit0 { 0%, 7.49% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } 7.5%, 88% { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); } 100% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } }
  .bays .sign:nth-child(1) { animation: lit0 3.2s linear infinite; }
  @keyframes lit1 { 0%, 22.49% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } 22.5%, 88% { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); } 100% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } }
  .bays .sign:nth-child(2) { animation: lit1 3.2s linear infinite; }
  @keyframes lit2 { 0%, 37.49% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } 37.5%, 88% { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); } 100% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } }
  .bays .sign:nth-child(3) { animation: lit2 3.2s linear infinite; }
  @keyframes lit3 { 0%, 52.49% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } 52.5%, 88% { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); } 100% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } }
  .bays .sign:nth-child(4) { animation: lit3 3.2s linear infinite; }
  @keyframes lit4 { 0%, 67.49% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } 67.5%, 88% { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); } 100% { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); } }
  .bays .sign:nth-child(5) { animation: lit4 3.2s linear infinite; }
  .status { font-size: .9375rem; color: var(--muted); }
  .slow { display: none; gap: .75rem; justify-items: center; }
  .wait.is-slow .slow { display: grid; }
  .slow a { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1.25rem; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 800; text-decoration: none; }

  /* 동작 줄이기: 트럭은 멈춰 있고 표지는 모두 켜진 채 */
  @media (prefers-reduced-motion: reduce) {
    .wait { transition: none; }
    .truck { animation: none; transform: translateX(calc(min(20rem, 100vw - 3rem) / 2 - 1.25rem)); }
    .bays .sign { animation: none !important; background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }
  }
</style>
</head>
<body>
  <div class="wait" id="wait" role="status">
    <div class="stage">
      <div>
        <span class="logo" aria-hidden="true"></span>
        <h1>오늘의 푸드트럭</h1>
        <p class="today" id="today"></p>
      </div>
      <div class="lot" aria-hidden="true">
        <div class="bays"><span class="sign"><b>A</b><small>자리</small></span><span class="sign"><b>B</b><small>자리</small></span><span class="sign"><b>C</b><small>자리</small></span><span class="sign"><b>D</b><small>자리</small></span><span class="sign"><b>E</b><small>자리</small></span></div>
        <div class="road"><span class="truck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path d="M5.5 10h6"/></svg></span></div>
      </div>
      <p class="status">오늘 온 트럭을 확인하고 있어요.</p>
      <div class="slow">
        <p class="status">화면이 계속 안 뜨면 아래 버튼으로 바로 열어주세요.</p>
        <a id="direct" href="#" target="_top">푸드트럭 맵 바로 열기</a>
      </div>
    </div>
  </div>
  <iframe id="app" title="오늘의 푸드트럭" allow="clipboard-write"></iframe>
<script>
  (function () {
    var wait = document.getElementById('wait'), frame = document.getElementById('app');
    document.getElementById('direct').href = APP_URL;
    // 오늘 날짜는 휴대폰 시계로 바로 표시 (데이터를 기다리지 않음)
    var d = new Date(), W = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('today').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + W[d.getDay()] + '요일';
    var slow = setTimeout(function () { wait.classList.add('is-slow'); }, 8000);
    // 앱이 실제로 그려졌을 때만 스플래시를 걷음 (iframe load 는 구글 오류 화면이어도 일어나서 믿을 수 없음)
    window.addEventListener('message', function (e) {
      if (e.data !== 'ftm:ready' || !/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
      clearTimeout(slow);
      wait.classList.add('out');
      setTimeout(function () { wait.hidden = true; }, 350);
    });
    frame.src = APP_URL;
  })();
  /* 앱과 같은 떠다니는 음식 (스플래시 안에만) */
  var FOOD_ICONS = {
    fish: "<path d='M2.5 12c2.6-4.6 9.4-5.6 13.6-2l4.4-3.2v10.4L16.1 14c-4.2 3.6-11 2.6-13.6-2z'/><circle cx='6.6' cy='11.2' r='.9'/><path d='M10 9.6c.9 1.5.9 3.3 0 4.8M12.8 9.8c.8 1.4.8 3 0 4.4'/>",
    skewer: "<path d='M3 21 21 3'/><rect x='5.6' y='14' width='4.4' height='4.4' rx='1.4' transform='rotate(45 7.8 16.2)'/><rect x='9.8' y='9.8' width='4.4' height='4.4' rx='1.4' transform='rotate(45 12 12)'/><rect x='14' y='5.6' width='4.4' height='4.4' rx='1.4' transform='rotate(45 16.2 7.8)'/>",
    burger: "<path d='M4 10.5a8 5.5 0 0 1 16 0z'/><path d='M3 13.5c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0'/><path d='M4 16.5h16'/><path d='M4.5 18.5h15a0 0 0 0 1 0 0 2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z'/><path d='M9 7.6h.01M12.5 6.8h.01M15 8.2h.01'/>",
    coffee: "<path d='M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z'/><path d='M16 10.5h1.2a2.4 2.4 0 0 1 0 4.8H16'/><path d='M8.5 3.5c-1 1 1 2 0 3M12 3.5c-1 1 1 2 0 3'/><path d='M4 21h13'/>",
    bowl: "<path d='M3 11.5h18a9 7.5 0 0 1-18 0z'/><path d='M6.5 9.5 10 6M10.5 9.5l3.5-3.5M14.5 9.5l2.5-2.5'/><path d='M9 21h6'/>",
    takoyaki: "<path d='M2.5 14h19l-2.2 5.5H4.7z'/><circle cx='7' cy='11' r='3'/><circle cx='12' cy='9.8' r='3'/><circle cx='17' cy='11' r='3'/>",
    hotdog: "<path d='M5 8.5h14a3.5 3.5 0 0 1 0 7H5a3.5 3.5 0 0 1 0-7z'/><path d='M2.5 12h19'/><path d='M6 10.6l1.8 1.4 1.8-1.4 1.8 1.4 1.8-1.4 1.8 1.4 1.8-1.4 1.8 1.4'/>",
    icecream: "<path d='M8 12l4 9.5 4-9.5'/><path d='M6.5 12a5.5 5.5 0 0 1 11 0z'/><path d='M9.3 15.5h5.4'/>",
    potato: "<path d='M3.5 15.5c-1.6-3.6 2.6-8.8 8.3-9.3 5.3-.5 9.5 2.4 8.6 5.8-.9 3.5-6 6.6-10.3 6.4-3.3-.2-5.7-1.1-6.6-2.9z'/><path d='M8 11.5l1 1M12.5 10.5l1 .8M15.8 12.4l.9.6M10.5 15l1 .6'/>",
    donut: "<circle cx='12' cy='12' r='8.5'/><circle cx='12' cy='12' r='2.8'/><path d='M7.5 7.8l.8.6M15.8 7.2l-.4.9M17.6 13.4l-.9.3M9 16.8l.7-.7M5.8 12.6l.9-.2'/>"
  };
  // [아이콘, 가로 %, 세로 %, 크기 rem, 한 번 움직이는 시간(초), 시작 지점(초), 기울기(도)] — 앞 10개만 휴대폰에서 보임
  var FOOD_SKY = [
    ['fish', 4, 10, 3.5, 34, -2, -14],
    ['coffee', 88, 8, 3, 28, -9, 8],
    ['skewer', 12, 42, 3.25, 31, -5, 20],
    ['burger', 92, 36, 3.5, 36, -12, -6],
    ['bowl', 3, 72, 3.25, 29, -7, 6],
    ['takoyaki', 85, 68, 3.25, 33, -15, -8],
    ['hotdog', 44, 93, 2.75, 38, -4, -10],
    ['icecream', 24, 86, 2.75, 27, -11, 12],
    ['potato', 70, 88, 3, 35, -3, -16],
    ['donut', 60, 22, 2.75, 32, -8, 10],
    ['fish', 30, 58, 2.5, 30, -13, 18],
    ['coffee', 76, 52, 2.5, 37, -6, -12],
    ['skewer', 52, 74, 2.5, 29, -10, -24],
    ['burger', 20, 22, 2.5, 34, -1, 8]
  ];
  (function () {
    var el = document.createElement('div');
    el.className = 'food-sky';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = FOOD_SKY.map(function (f) {
      return '<i style="left:' + f[1] + '%;top:' + f[2] + '%;width:' + f[3] + 'rem;height:' + f[3] + 'rem;--r:' + f[6] + 'deg;' +
        'animation-duration:' + f[4] + 's;animation-delay:' + f[5] + 's"><svg viewBox="0 0 24 24" focusable="false">' + FOOD_ICONS[f[0]] + '</svg></i>';
    }).join('');
    document.getElementById('wait').insertBefore(el, document.getElementById('wait').firstChild);
  })();
</script>
</body>
</html>
